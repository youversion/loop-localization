#
# Crowdin credentials for loop-localization source string CRUD.
#
# Same Crowdin project as loop-ios/Flutter (257). This repo owns pushing new
# source strings; loop-ios and youversion-flutter-loop only pull translations.
#
# `dest`/`translation` are pinned to youversion-flutter-loop's existing
# Crowdin path (assets/strings/en/*.po) rather than this repo's own
# strings/en/ layout -- pushes from here must land on the same Crowdin files
# Flutter already pushes to, or they'd create duplicate strings instead of
# updating existing ones.
#
"project_id": "257"
"base_path": ".."
"base_url": "https://youversion.crowdin.com"
"preserve_hierarchy": true

"files": [
    {
        "source": "strings/en/*.po",
        "dest": "assets/strings/en/%original_file_name%",
        "translation": "assets/strings/%two_letters_code%/%original_file_name%",
    },
]

"api_token_env": "CROWDIN_API_TOKEN"
