#
# Crowdin credentials for loop-localization source string CRUD.
#
# Same Crowdin project as loop-ios/Flutter (257). This repo owns pushing new
# source strings; loop-ios and youversion-flutter-loop only pull translations.
#
# `dest`/`translation` are pinned to "Bible Loop (Master)/*.po" -- confirmed
# via `crowdin file list` to be the actual live source directory in project
# 257 (30 existing files), not youversion-flutter-loop's own
# assets/strings/en/*.po entry, which does not exist in the live project.
# Pushes from here must land on these existing Crowdin files, or they'd
# create duplicate strings instead of updating existing ones.
#
"project_id": "257"
"base_path": ".."
"base_url": "https://youversion.crowdin.com"
"preserve_hierarchy": true

"files": [
    {
        "source": "strings/en/*.po",
        "dest": "Bible Loop (Master)/%original_file_name%",
        "translation": "Bible Loop (Master)/%two_letters_code%/%original_file_name%",
    },
]

"api_token_env": "CROWDIN_API_TOKEN"
